name: Keep Render Alive

on:
  schedule:
    # این عبارت Cron یعنی: هر 10 دقیقه یک بار اجرا شو
    - cron: '*/10 * * * *'

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Send ping to Render
        run: |
          curl -s -o /dev/null -w "%{http_code}" https://alxim-1.onrender.com
          echo "✅ Ping sent!"
